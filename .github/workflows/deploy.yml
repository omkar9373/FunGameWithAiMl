name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Executing remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '187.126.123.14' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            cd /var/www/Number-Probability
            git fetch origin main
            git reset --hard origin/main
            chmod +x /var/www/Number-Probability/deployment/deploy.sh
            bash /var/www/Number-Probability/deployment/deploy.sh
